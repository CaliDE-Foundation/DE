name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zig + Rust + Go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Sookie is built in its own repo, so the submodule isn't needed here.
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod

      - name: Build
        run: make all

      - name: Test
        run: make test

      - name: Run
        run: make run

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: calide-x86_64
          path: out/bin/
          retention-days: 14

  sookie:
    name: With Sookie (Fedora 45)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/fedora-deps.sh

      - name: Install latest Sookie
        run: |
          curl -fL --retry 3 \
            https://github.com/CaliDE-Foundation/Sookie/releases/download/nightly/sookie-x86_64.tar.xz \
            | tar -C / -xJ
          echo "Sookie $(curl -fsL https://github.com/CaliDE-Foundation/Sookie/releases/download/nightly/sookie-x86_64.commit)"

      - name: Build with Sookie
        run: make compositor-sookie services

      - name: Start Sookie headless
        run: make smoke-sookie

      - name: Build Cali Settings
        run: |
          dnf install -y --setopt=install_weak_deps=False gtk4-devel libadwaita-devel
          make settings-app

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: calide-sookie-fedora45-x86_64
          path: out/bin/
          retention-days: 14
