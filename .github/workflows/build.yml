name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zig + Rust + Go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Sookie is built in its own repo, so the submodule isn't needed here.
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod

      - name: Build
        run: make all

      - name: Test
        run: make test

      - name: Run
        run: make run

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: calide-x86_64
          path: out/bin/
          retention-days: 14
