# Portals for the Cali desktop (XDG_CURRENT_DESKTOP=Cali). The GNOME backend
# provides screen sharing and remote desktop through Sookie's
# org.gnome.Mutter.ScreenCast, screenshots through org.gnome.Shell.Screenshot
# (served by cali-compositor) and settings such as dark style.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
