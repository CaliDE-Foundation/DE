[package]
name = "cali-shell"
description = "The Cali desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cali_shell"
crate-type = ["staticlib", "rlib"]

[dependencies]
# App and status icons. No text support needed (icons don't use fonts).
resvg = { version = "0.45.1", default-features = false }
tiny-skia = "0.11.4"
# JPEG wallpapers (PNG goes through tiny-skia).
jpeg-decoder = { version = "0.3.1", default-features = false }
