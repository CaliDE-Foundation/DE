[workspace]
resolver = "2"
members = ["shell", "settings-app"]
# Cali Settings needs GTK 4 and libadwaita headers; build it explicitly
# (`make settings-app`) so the rest builds anywhere.
default-members = ["shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/CaliDE-Foundation/DE"

[profile.release]
lto = "thin"
panic = "abort"
